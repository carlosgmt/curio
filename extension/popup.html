<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Curio Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafaf9;
      color: #1c1917;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: #e7e5e4;
      border-radius: 999px;
      color: #78716c;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #78716c;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      background: #ffffff;
      font-size: 13px;
      color: #1c1917;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #1c1917;
      box-shadow: 0 0 0 2px rgba(28,25,23,0.1);
    }
    textarea {
      resize: vertical;
      min-height: 54px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1c1917;
      color: #fafaf9;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }
    .status.success { color: #15803d; }
    .status.error { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>Curio</span>
      <span class="badge">Taste Graph</span>
    </div>
  </div>

  <form id="capture-form">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" required />
    </div>

    <div class="field">
      <label for="url">URL</label>
      <input type="url" id="url" required />
    </div>

    <div class="field">
      <label for="notes">Curator Notes (Optional)</label>
      <textarea id="notes" placeholder="Why does this matter? Personal reaction, pairing..."></textarea>
    </div>

    <button type="submit" id="save-btn">
      <span>Capture to Curio</span>
    </button>
  </form>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
