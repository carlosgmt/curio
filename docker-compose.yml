services:
  curio:
    build:
      context: .
      dockerfile: Dockerfile
    image: curio:latest
    container_name: curio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /Users/carlosgmt/dockermounts/curio:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/data/curio.db
      - MEDIA_PATH=/data/media
      - CURIO_ALLOW_ANON=true
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - REBUILD_VERSION=2
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "homepage.group=Personal"
      - "homepage.name=Curio"
      - "homepage.icon=sparkles.png"
      - "homepage.href=https://mini.orca-banjo.ts.net/curio"
      - "homepage.description=Taste Graph & Autonomous Memory"

  litestream:
    image: litestream/litestream
    profiles: ["backup"]
    volumes:
      - /Users/carlosgmt/dockermounts/curio:/data
      - ./litestream.yml:/etc/litestream.yml
    command: replicate
    depends_on: [curio]

  whisper:
    profiles: ["voice"]
    image: ghcr.io/ggerganov/whisper.cpp:main
    volumes: ["./models:/models"]

  vision:
    profiles: ["vision"]
    image: ollama/ollama
    volumes: ["./models:/root/.ollama"]
    ports: ["11434:11434"]
