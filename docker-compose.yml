services:
  brainspace:
    build: .
    container_name: brainspace
    environment:
      DATABASE_PATH: /data/memory.db
      MEDIA_PATH: /data/media
      PORT: "3000"
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    volumes: ["./data:/data"]
    ports: ["3000:3000"]
    restart: unless-stopped

  litestream:
    image: litestream/litestream
    profiles: ["backup"]
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml
    command: replicate
    depends_on: [brainspace]

  whisper:
    profiles: ["voice"]
    image: ghcr.io/ggerganov/whisper.cpp:main
    volumes: ["./models:/models"]

  vision:
    profiles: ["vision"]
    image: ollama/ollama
    volumes: ["./models:/root/.ollama"]
    ports: ["11434:11434"]
